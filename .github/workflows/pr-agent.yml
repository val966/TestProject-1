name: PR Agent Review
on: 
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run PR Agent
        uses: Codium-ai/pr-agent@main
        env: 
          CONFIG.GIT_PROVIDER: github

          GROQ.API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          
          CONFIG.MODEL: "groq/openai/gpt-oss-20b"
          CONFIG.FALLBACK_MODELS: "['groq/qwen/qwen3.8-27b', 'groq/openai/gpt-oss-120b']"

          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32000"

          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB.PERSONAL_ACCESS_TOKEN: ${{ secrets.GH_TOKEN }}

          CONFIG.RESPONSE_LANGUAGE: "ru-RU"
          PR_DESCRIPTION.PUBLISH_DESCRIPTION_AS_COMMNENT: true
          PR_DESCRIPTION.ENABLE_PR_DIAGRAM: false
          PR_DESCRIPTION.GENERATE_AI_TITLE: true
          PE_REVIEW.ENABLE_REVIEW_LABELS_EFFORT: true
          PR_REVIEWER.EXTRA_INSTRUCTIONS: "Отвечай на русском. Обращай особое внимание на аллокацию памяти, производительность LINQ запросов и потенциальные проблемы N+1 в Entity Framework. Предлагай более оптимальные структуры данных, если это уместно"
          PR_AGENT.PR_ACTIONS: "review,describe,improve"
          
          
